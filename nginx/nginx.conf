# Reverse proxy for the whole stack.
#
# - /widget.js       -> the widget's built single-file bundle, baked into
#                       this image at build time (see nginx/Dockerfile)
# - /api/            -> the backend (FastAPI), unbuffered end-to-end — the
#                       backend already sets X-Accel-Buffering: no on its
#                       SSE chat route (app/api/v1/public_chat.py) for
#                       exactly this proxy; this config is what makes that
#                       header load-bearing instead of a no-op
# - everything else  -> the Next.js dashboard
#
# TLS is not configured here — add a `listen 443 ssl` server block with real
# certificates (e.g. via certbot/Let's Encrypt) before exposing this beyond
# local testing. Out of scope for Step 10.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        location = /widget.js {
            root /usr/share/nginx/widget;
            add_header Cache-Control "public, max-age=300";
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Unbuffered for the whole prefix, not just the one SSE route —
            # simpler than a second location block matching just that path,
            # and harmless for the ordinary JSON responses on every other
            # route here.
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://dashboard:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
