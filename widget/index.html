<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent Widget Dev Harness</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 680px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1f2937;
        background-color: #f9fafb;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
        margin-top: 0;
      }
      p {
        color: #4b5563;
        line-height: 1.6;
      }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.875rem;
        color: #1f2937;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.8125rem;
        font-weight: 500;
        background-color: #ecfdf5;
        color: #065f46;
        margin-bottom: 16px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
      }
      .form-group {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      input {
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-badge">
        <span class="status-dot"></span>
        Widget Connected & Active
      </div>
      <h1>Simulated Customer Website</h1>
      <p>
        This simulated host page embeds the AI Voice &amp; Chat widget. Look at the <strong>bottom-right corner</strong> to interact with the floating launcher.
      </p>

      <form id="configForm" class="form-group" onsubmit="updateConfig(event)">
        <label for="agentKeyInput" style="font-weight: 600; font-size: 0.875rem;">Active Agent Key:</label>
        <div style="display: flex; gap: 8px;">
          <input id="agentKeyInput" style="flex: 1;" type="text" placeholder="agt_pub_..." />
          <button type="submit">Update Key</button>
        </div>
      </form>
    </div>

    <script>
      const DEFAULT_AGENT_KEY = "agt_pub_Q3ZjMOLNQFYl75-hEu2I-hRFcrlocKly";
      const params = new URLSearchParams(location.search);
      const agentKey = params.get("agentKey") || DEFAULT_AGENT_KEY;
      const apiBase = params.get("apiBase") || "http://127.0.0.1:8000/api/v1";

      document.getElementById("agentKeyInput").value = agentKey;

      function updateConfig(e) {
        e.preventDefault();
        const newKey = document.getElementById("agentKeyInput").value.trim();
        const url = new URL(location.href);
        url.searchParams.set("agentKey", newKey);
        location.href = url.toString();
      }

      window.__VOICE_AGENT_DEV__ = {
        publicKey: agentKey,
        apiBaseUrl: apiBase,
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
